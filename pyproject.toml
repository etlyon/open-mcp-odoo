[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mcp-odoo"
version = "0.1.0"
description = "Connect any assistant to your own Odoo: you bring your server or account and your own key."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "fastmcp==4.1.6",
  "mcp==2.3.0",
  "httpx==0.28.1",
  "idna==3.18",
  "cryptography==50.0.0",
  "starlette==1.6.0",
  "uvicorn==0.52.1",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "pypdf==6.21.4",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
]

[project.scripts]
open-connectors = "open_connectors.server:main"

[tool.setuptools.packages.find]
where = ["src"]
